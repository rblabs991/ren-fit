<!doctype html>
<html lang="en" class="standalone">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ren Fit</title>
<meta name="description" content="A daily home routine with a 3D coach, simple meals and a habit checklist.">
<meta name="theme-color" content="#0d1418">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ren Fit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<!--APP-->
<main class="app" id="app"></main>

<nav class="tabs" data-i18n-label="tab_today"><div class="tabs-in" role="tablist">
  <button class="tab" role="tab" data-tab="today" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg><span data-i18n="tab_today">Today</span></button>
  <button class="tab" role="tab" data-tab="workout" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="4.5" r="2"/><path d="M8 21l3-6 3 2v4M11 15l1-5-4 2-1 3M12 10l3 3 3-1"/></svg><span data-i18n="tab_workout">Workout</span></button>
  <button class="tab" role="tab" data-tab="recipes" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11h18a9 9 0 0 1-18 0Z"/><path d="M8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5"/></svg><span data-i18n="tab_recipes">Recipes</span></button>
  <button class="tab" role="tab" data-tab="checklist" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="m8 12 3 3 5-6"/></svg><span data-i18n="tab_check">Checklist</span></button>
  <button class="tab" role="tab" data-tab="settings" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg><span data-i18n="tab_settings">Settings</span></button>
</div></nav>

<section class="player" id="player" hidden>
  <div class="pl-top">
    <div class="pl-progress" aria-hidden="true"><i id="plBar"></i></div>
    <div class="lang" role="group"><button data-lang="en">EN</button><button data-lang="hr">HR</button></div>
    <button class="icon-btn" id="plFs" aria-label="Full screen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="icon-btn" id="plClose" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="pl-body">
    <div class="stage" id="stage">
      <div class="stage-tag" id="stageTag"></div>
      <div class="inset" hidden><span data-i18n="p_angle2">Second angle</span></div>
      <div class="stage-hint" id="stageHint" data-i18n="p_drag">Drag to turn · double-tap to reset</div>
      <div class="stage-err" id="stageErr" data-i18n="p_nogl" hidden></div>
    </div>
    <div class="panel">
      <div class="pl-info">
      <div class="pl-eyebrow" id="plEyebrow"></div>
      <h2 class="pl-name" id="plName"></h2>
      <div class="pl-clock" id="plClock"><span class="pl-time" id="plTime">0:00</span><span class="pl-sub" id="plSub"></span></div>
      <div class="pl-phase" id="plPhase" aria-live="off"></div>
      <p class="pl-cue" id="plCue"></p>
      <p class="pl-text" id="plText" hidden></p>
      <ul class="pl-cues" id="plCues" hidden></ul>
      <div class="pl-mus" id="plMus"></div>
      <div class="pl-next" id="plNext"></div>
      </div>
      <div class="pl-ctl" id="plCtl">
        <button id="plPrev" aria-label="Previous"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button id="plPause" class="pause"><svg id="plPauseIc" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg><span id="plPauseTx">Pause</span></button>
        <button id="plSkip" aria-label="Next"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
        <button id="plVoice" aria-label="Voice"><svg id="plVoiceIc" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
      </div>
    </div>
  </div>
  <div class="pl-done" id="plDone" hidden>
    <div class="pl-done-card">
      <div class="eyebrow" style="color:var(--go)" data-i18n="p_done_eb">Routine complete</div>
      <h2 id="plDoneH"></h2>
      <p class="muted" id="plDoneTx"></p>
      <button class="btn btn-primary" id="plDoneBtn" data-i18n="p_back">Back to Today</button>
    </div>
  </div>
</section>
<!--/APP-->
<script src="vendor/three.min.js"></script>
<script src="js/data.js"></script>
<script src="js/figure.js"></script>
<script src="js/app.js"></script>
</body>
</html>
